<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Resume Checker | Asra's AI Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand-wrap sidebar-brand">
          <div class="brand-mark">A</div>
          <div>
            <p class="eyebrow">Growth Tools</p>
            <h2>Asra AI</h2>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Home</a>
          <a class="nav-item" href="planner.html">Study Planner</a>
          <a class="nav-item" href="quiz.html">Technical Quiz</a>
          <a class="nav-item" href="question-bank.html">Question Bank</a>
          <a class="nav-item" href="roadmap.html">Career Roadmap</a>
          <a class="nav-item active" href="ats.html">ATS Checker</a>
          <a class="nav-item" href="notes.html">Notes</a>
          <a class="nav-item" href="achievements.html">Achievements</a>
        </nav>
      </aside>
      <main class="workspace-main">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">ATS Resume Checker</p>
            <h1>See your estimated match, skills, and suggestions</h1>
          </div>
          <div class="workspace-actions">
            <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
          </div>
        </header>
        <section class="workspace-panel">
          <form id="atsForm" class="mini-form">
            <input id="atsResumeInput" type="file" accept=".pdf,.docx" />
            <textarea id="atsJobDescription" rows="8" placeholder="Paste a target job description"></textarea>
            <button type="submit" class="btn btn-primary">Check ATS score</button>
          </form>
          <div id="atsResult" class="result-shell hidden"></div>
        </section>
      </main>
    </div>
    <script src="feature-common.js"></script>
    <script src="ats.js"></script>
  </body>
</html>

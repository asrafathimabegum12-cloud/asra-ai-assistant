<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Notes | Asra's AI Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand-wrap sidebar-brand">
          <div class="brand-mark">A</div>
          <div>
            <p class="eyebrow">Growth Tools</p>
            <h2>Asra AI</h2>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html">Home</a>
          <a class="nav-item" href="tutor.html">AI Tutor</a>
          <a class="nav-item" href="tests.html">Practice Tests</a>
          <a class="nav-item" href="performance.html">Performance Tracker</a>
          <a class="nav-item" href="resume.html">Resume Analyzer</a>
          <a class="nav-item" href="jobs.html">Job Recommendations</a>
          <a class="nav-item" href="profile.html">Edit Profile</a>
          <a class="nav-item" href="planner.html">Study Planner</a>
          <a class="nav-item" href="ats.html">ATS Score Checker</a>
          <a class="nav-item" href="learning.html">Learning Plans</a>
          <a class="nav-item" href="interviews.html">Mock Interviews</a>
          <a class="nav-item" href="profile.html">My Profile</a>
        </nav>
      </aside>
      <main class="workspace-main">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Personal Notes</p>
            <h1>Add, edit, and delete your study notes</h1>
          </div>
          <div class="workspace-actions">
            <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
          </div>
        </header>
        <section class="workspace-panel">
          <form id="notesForm" class="mini-form">
            <input id="notesTitle" type="text" placeholder="Note title" required />
            <select id="notesCategory">
              <option value="General">General</option>
              <option value="Interview Prep">Interview Prep</option>
              <option value="Python">Python</option>
              <option value="SQL">SQL</option>
            </select>
            <textarea id="notesContent" rows="6" placeholder="Write a note..." required></textarea>
            <button type="submit" class="btn btn-primary">Save note</button>
          </form>
          <div id="notesList" class="list-shell"></div>
        </section>
      </main>
    </div>
    <script src="feature-common.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
